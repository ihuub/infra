
user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

		geo $remote_addr $is_admin {
			35.212.175.172 1;#google需改2处-第1处    
			default 0;
		}
	
		geo $remote_addr $logg {	  	
			35.212.175.172 0; #google需改2处-第2处，日志不记录   
			default 1; #非管理员ip    	
		}
	
		map $uri $final_log {    
			~*\.(js|css|png|svg|woff|woff2|ico)$  0;
			~/index\.html 0;    
			default   $logg; 
		}
	
		map $http_user_agent $blocked_user_agent {
			~*Mozilla/5\.0[1-9] 1;
			~*Android\s[2-9] 1;
			~*OS\s9 1;			
			~*Chrome/([2-7][0-9]|8[0-9]) 1;
			~*aweme|Windows|Macintosh|Baidu|Quark|MicroMessenger|Slut|Browser|bot|python|compatible|http|QQ|zgrab|qcloudcdn|ArkWeb|wv|OPR|Telegram|x86|Spider|^$  1;	
			~Build/[A-Z0-9]+  1;
			default 0;
		}
	
		map $server_protocol $reject_protocol {	
			"HTTP/2.0"   0;
			"HTTP/3.0"   0;
			default      1;
		}
	
		map $request_uri $forbidden_uri {	
			~*forget|html  1;
			default 0;
		}
	
		map $http_referer $bad_referer {
			~*localhost|session 1;
			default 0;
		}
	
		map $http_cookie $block_cookie {	
			~*argon 1;
			default 0;
		}
	
		map "$is_admin:$blocked_user_agent:$reject_protocol:$forbidden_uri:$bad_referer:$block_cookie" $final_block {    
			~^1:        0;# 管理员放行    
			0:0:0:0:0:0 0;# 普通用户正常请求(非异常)放行
			default     1;
		}

    log_format main '[$time_local]\n'
			'remote_addr=$remote_addr\n'           
			'user_agent="$http_user_agent"\n'
			'http_referer="$http_referer"\n' 			                     
			'http_host=$http_host' '$request\n'			
			'http_range=$http_range\n'
			'status=$status\n'
			'cookie=$http_cookie\n'; 
	
		sendfile    on;
		tcp_nopush  on;
		tcp_nodelay on;
		
		keepalive_timeout  65;
		
		server_tokens off; 

		gzip on;		
		gzip_comp_level 5;		
		gzip_min_length 1024;		
		gzip_buffers 16 8k;		
		gzip_http_version 1.1;
		gzip_types
			text/plain
			text/css
			text/xml
			text/javascript
			application/javascript
			application/json
			application/xml
			application/rss+xml
			application/atom+xml
			application/xhtml+xml
			application/manifest+json
			image/svg+xml
			font/ttf
			font/otf
			application/vnd.ms-fontobject
			application/x-font-ttf
			application/x-font-opentype;
		gzip_disable "msie6";
		gzip_proxied any;
		gzip_vary on; 
		
		add_header Content-Security-Policy "frame-ancestors 'self'" always;	
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;	
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header X-Robots-Tag "noindex, nofollow, noarchive" always;	
		add_header_inherit merge;  

    include /etc/nginx/conf.d/*.conf;
		include /etc/nginx/8G-Firewall-v1.5/8g-firewall.conf;
}